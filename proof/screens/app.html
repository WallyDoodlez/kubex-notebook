<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shopdesk</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,"Segoe UI",sans-serif;color:#1f2937;background:#f3f4f6;height:400px;overflow:hidden}
.top{height:44px;background:#111827;color:#fff;display:flex;align-items:center;gap:20px;padding:0 18px}
.top b{font-size:15px}.top span{color:#9ca3af;font-size:13px}
.wrap{padding:16px 18px}
h1{font-size:18px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px #0002}
th,td{text-align:left;padding:9px 12px;font-size:13px;border-bottom:1px solid #e5e7eb}
th{color:#6b7280;font-weight:500}
tr.sel td{background:#eff6ff}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:#dcfce7;color:#166534}
.tag.open{background:#fef3c7;color:#92400e}
.card{background:#fff;border-radius:8px;padding:14px 16px;box-shadow:0 1px 2px #0002;margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.btn{display:inline-block;padding:8px 14px;border-radius:6px;background:#2563eb;color:#fff;font-size:13px;border:0}
.btn.ghost{background:#fff;color:#374151;border:1px solid #d1d5db}
.btn.danger{background:#dc2626}
.btn.big{padding:11px 22px;font-size:14px;font-weight:600}
.scrim{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center}
.dialog{width:340px;background:#fff;border-radius:10px;padding:18px}
.dialog h2{font-size:16px;margin:0 0 8px}
input{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;margin:8px 0 12px;font-size:13px}
.note{padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.note.ok{background:#dcfce7;color:#166534}
.note.bad{background:#fee2e2;color:#991b1b}
.right{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<div class="top"><b>Shopdesk</b><span>Orders</span><span>Customers</span><span>Reports</span></div>
<div class="wrap" id="v"></div>
<script>
const s = new URLSearchParams(location.search).get('s') || 'orders';
const list = `<h1>Orders</h1><table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr>
<tr class="sel"><td>#10482</td><td>Dana Reyes</td><td>$84.00</td><td><span class="tag">Paid</span></td></tr>
<tr><td>#10481</td><td>Sam Okafor</td><td>$212.50</td><td><span class="tag open">Open</span></td></tr>
<tr><td>#10480</td><td>Lee Tran</td><td>$19.99</td><td><span class="tag">Paid</span></td></tr>
<tr><td>#10479</td><td>Ana Silva</td><td>$145.00</td><td><span class="tag">Paid</span></td></tr></table>`;
const detail = (extra, big) => `<h1>Order #10482</h1><div class="card"><div class="row"><span>Customer</span><span>Dana Reyes</span></div><div class="row"><span>Items</span><span>2 × Linen shirt</span></div><div class="row"><span>Total</span><b>$84.00</b></div></div>${extra}<div class="right"><span class="btn ghost">Print</span><span class="btn danger ${big ? 'big' : ''}">Refund</span></div>`;
const views = {
    orders: list,
    detail: detail(''),
    'detail-new': detail('', true),
    dialog: detail('') + `<div class="scrim"><div class="dialog"><h2>Refund $84.00?</h2>Reason<input value="Wrong size"><div class="right"><span class="btn ghost">Cancel</span><span class="btn danger">Confirm refund</span></div></div></div>`,
    done: detail('<div class="note ok">Refund of $84.00 sent. Dana will see it in 3 to 5 days.</div>'),
    error: detail('<div class="note bad">Stripe declined the refund: the charge is older than 180 days.</div>'),
};
document.getElementById('v').innerHTML = views[s];
</script>
</body>
</html>
