<svg viewBox="0 0 720 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A web app as four stacked layers: client, gateway, services, data">
<style>
svg{--bg:#fbfbfa;--edge:#71717a;--mid:#a1a1aa;--lo:#d4d4d8;--hi:#18181b;--acc:#2563eb}
@media (prefers-color-scheme:dark){svg{--bg:#08090a;--edge:#a1a1aa;--mid:#52525b;--lo:#27272a;--hi:#fafafa;--acc:#60a5fa}}
.bg{fill:var(--bg)}
.sil{fill:var(--bg);stroke:var(--edge);stroke-width:.9;stroke-linejoin:round}
.crease{fill:none;stroke:var(--mid);stroke-width:.9;stroke-linejoin:round;transition:stroke .25s}
.rail{stroke:var(--lo);stroke-width:.9;stroke-dasharray:2 4}
.layer{transition:transform .5s cubic-bezier(.2,.9,.25,1.15)}
.hit{fill:transparent;cursor:pointer}
.cap{font:12.5px ui-monospace,Consolas,monospace;fill:var(--edge);text-anchor:middle;opacity:0;transition:opacity .2s}
.rest{opacity:1}
.dot{fill:var(--acc)}
svg:has(.h0:hover) .l0{transform:translateY(-16px);transition-delay:0ms}svg:has(.h0:hover) .l1{transform:translateY(-42px);transition-delay:45ms}svg:has(.h0:hover) .l2{transform:translateY(-50px);transition-delay:90ms}svg:has(.h0:hover) .l3{transform:translateY(-58px);transition-delay:135ms}svg:has(.h1:hover) .l0{transform:translateY(10px);transition-delay:45ms}svg:has(.h1:hover) .l1{transform:translateY(-16px);transition-delay:0ms}svg:has(.h1:hover) .l2{transform:translateY(-42px);transition-delay:45ms}svg:has(.h1:hover) .l3{transform:translateY(-50px);transition-delay:90ms}svg:has(.h2:hover) .l0{transform:translateY(20px);transition-delay:90ms}svg:has(.h2:hover) .l1{transform:translateY(10px);transition-delay:45ms}svg:has(.h2:hover) .l2{transform:translateY(-16px);transition-delay:0ms}svg:has(.h2:hover) .l3{transform:translateY(-42px);transition-delay:45ms}svg:has(.h3:hover) .l0{transform:translateY(30px);transition-delay:135ms}svg:has(.h3:hover) .l1{transform:translateY(20px);transition-delay:90ms}svg:has(.h3:hover) .l2{transform:translateY(10px);transition-delay:45ms}svg:has(.h3:hover) .l3{transform:translateY(-16px);transition-delay:0ms}svg:has(.h0:hover) .l0 .plate{stroke:var(--hi);stroke-width:1.4}svg:has(.h0:hover) .c0{opacity:1}svg:has(.h0:hover) .rest{opacity:0}svg:has(.h1:hover) .l1 .plate{stroke:var(--hi);stroke-width:1.4}svg:has(.h1:hover) .c1{opacity:1}svg:has(.h1:hover) .rest{opacity:0}svg:has(.h2:hover) .l2 .plate{stroke:var(--hi);stroke-width:1.4}svg:has(.h2:hover) .c2{opacity:1}svg:has(.h2:hover) .rest{opacity:0}svg:has(.h3:hover) .l3 .plate{stroke:var(--hi);stroke-width:1.4}svg:has(.h3:hover) .c3{opacity:1}svg:has(.h3:hover) .rest{opacity:0}
</style>
