<text class="cap rest" x="360" y="584">a request, top to bottom · hover a layer</text>
<text class="cap c0" x="360" y="584">data · Postgres keeps the orders; Redis answers repeat reads first</text><text class="cap c1" x="360" y="584">services · auth signs tokens; orders holds the business rules</text><text class="cap c2" x="360" y="584">gateway · checks the token locally, then routes the request</text><text class="cap c3" x="360" y="584">client · the browser sends the request with its cookie</text>
